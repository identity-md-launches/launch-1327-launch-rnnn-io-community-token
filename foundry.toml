[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
ffi = false

[lint]
# Events in the hook are emitted after calls into the PoolManager it is bound to, which is the only
# external contract it talks to; the ordering is intentional and cannot be reordered by a third party.
exclude_lints = ["reentrancy-events"]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
